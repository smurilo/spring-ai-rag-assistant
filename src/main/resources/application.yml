spring:
  application:
    name: spring-ai-rag-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assistant}
    username: ${DB_USER:assistant}
    password: ${DB_PASSWORD:assistant}
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      init:
        pull-model-strategy: when_missing
      chat:
        options:
          model: ${CHAT_MODEL:llama3.2}
          temperature: 0.2
      embedding:
        options:
          model: ${EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768

assistant:
  ingest-on-startup: true
