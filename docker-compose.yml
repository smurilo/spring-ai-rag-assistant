services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: assistant, POSTGRES_USER: assistant, POSTGRES_PASSWORD: assistant }
    ports: [ "5432:5432" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U assistant"], interval: 5s, retries: 10 }

  ollama:
    image: ollama/ollama:0.5.7
    ports: [ "11434:11434" ]
    volumes: [ "ollama:/root/.ollama" ]

  app:
    build: .
    depends_on:
      pgvector: { condition: service_healthy }
      ollama: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://pgvector:5432/assistant
      OLLAMA_URL: http://ollama:11434
    ports: [ "8080:8080" ]

volumes:
  ollama:
